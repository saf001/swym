<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Swym Copy Utility</title>
        <script type="text/javascript">
            (function() {
                var uwaPath;
                try {
                    uwaPath = widget.uwaUrl.substring(0, widget.uwaUrl.lastIndexOf("/") + 1);
                } catch (error) {
                    uwaPath = "./";
                }

                // Append a timestamp cache-buster to prevent stale version files
                var versionUrl = uwaPath + "static/version.json?ts=" + Date.now();

                fetch(versionUrl)
                    .then(function (response) {
                        if (!response.ok) {
                            throw new Error("Network response was not ok: " + response.status);
                        }
                        return response.json();
                    })
                    .then(function (version) {
                        if (!version || !version.stable) {
                            throw new Error("Invalid version structure");
                        }
                        var scriptElement = document.createElement("script");
                        scriptElement.src = uwaPath + "bundle.js?v=" + version.stable;
                        
                        // Handle potential failures loading the bundle itself
                        scriptElement.onerror = function() {
                            showErrorMessage();
                        };
                        
                        document.head.appendChild(scriptElement);
                    })
                    .catch(function (error) {
                        console.error("Widget initialization failed:", error);
                        showErrorMessage();
                    });

                function showErrorMessage() {
                    // Check if DOM is ready, otherwise wait for it
                    var displayError = function() {
                        var pElement = document.createElement("p");
                        pElement.innerText = "An error occurred while loading the widget. Please retry later.";
                        pElement.style.color = "red";
                        pElement.style.textAlign = "center";
                        document.body.appendChild(pElement);
                    };

                    if (document.body) {
                        displayError();
                    } else {
                        document.addEventListener("DOMContentLoaded", displayError);
                    }
                }
            })();
        </script>
    </head>
    <body>
        <my-app></my-app>
    </body>
</html>
